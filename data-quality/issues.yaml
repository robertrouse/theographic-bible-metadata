    a55d681. gedor_456 (1 Chr 4:39, Simeon) → gedor_455 (Judah), 54 km.
    shaaraim_1056 (1 Chr 4:31) → shaaraim_1055, 66 km. hukok_587
    (1 Chr 6:75, Asher) → hukkok_586 (Naphtali), 20 km. beth-aven_191: all
    7 verses alias to Bethel. kir_693 has OpenBible id ab92800 (Kir 1,
    Mesopotamia, 33.12, 45.93), but its coordinates are the Kerak point
    31.1813258, 35.70214779 (987 km away). It carries the Assyrian Kir
    verses (2 Kgs 16:9; Isa 22:6; Amos 1:5, 9:7) plus Isa 15:1 "Kir of
    Moab". mizpeh_814 (1 Sam 22:3, Mizpeh of Moab) is aliased to kir_693.
    Deut 3:13 links "land" in "which was called the land of giants" (Bashan)
    to rephaim_995, which is aliased to the Valley of Rephaim near Jerusalem.
  proposed: >-
    Remove the wrong canonicalPlace links. Give each record its own
    OpenBible id: beer_165 → a520374 (Beer 2); bozrah_257 → a8adc43
    (Bozrah 2); mount_heres_840 → aeea26d; ephron_406 → a1230e5 (Ephron 2);
