  field: startDate
  current: "-1451"
  proposed: "-1450"
  evidence: >-
    Predecessor Birth of Moses (-1570) + lag 120Y FS = -1450 (1451 BC). Deut 34:7 (120 years).
    Lifetime of Moses (recJOhn4C4yKIJmvH) already ends at -1450. Confirm against Jones, Appendix F.
  checks:
    - { record: recxj71m6XPSaqIg2, field: startDate, equals: "-1450" }
  rule: date-matches-predecessor-lag
  found: { date: 2026-11-04, by: "timeline poster v0.2 (normalize.mjs)", sha: 3f461f2 }
