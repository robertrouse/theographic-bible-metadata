  current: >-
    Theographic already has two Mount Hor records. mount_hor_842 holds
    the ten Edom / death-of-Aaron verses (Num 20:22, 20:23, 20:25,
    20:27, 21:4, 33:37, 33:38, 33:39, 33:41; Deut 32:50) and displays
