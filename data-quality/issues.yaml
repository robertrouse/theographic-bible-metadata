- id: DQ-0117
  title: "Research whether Riblah of Shepham (Num 34:11) is a separate place from Riblah on the Orontes"
  status: needs-research
  type: wrong-value
  severity: low
  table: places
  records:
    - { id: recTIHqZ7BB8IVwFt, key: "riblah_1002 (Num 34:11; Pleiades 431124909 at 34.432149, 36.549142)" }
    - { id: recwejjn5PDlbkVgH, key: "riblah_1001 (2 Kgs 23:33, 25:6, 25:20-21; Jer 39:5-6, 52:9-10, 52:26-27; Ezek 6:14)" }
  field: latitude, longitude, pleiadesUri
  current: >-
    Theographic already has two Riblah records. riblah_1002 holds only
    Num 34:11 ("the coast shall go down from Shepham to Riblah, on the
    east side of Ain; and the border shall descend, and shall reach
    unto the side of the sea of Chinnereth eastward") in the
    description of Israel's northern boundary. Since the DQ-0109
    review it displays Pleiades 431124909 at 34.432149, 36.549142
    (Riblah on the Orontes / Ribleh). Its OpenBible article is ac95bd8
    at 34.353071, 36.385705, about 19 km southwest of that Pleiades
    point but still in the same northern area. The GeoJSON feature
    linked to riblah_1002 is titled "Riblah (of Shepham)" and sits at
    33.536944, 36.366111, about 101 km south of the Pleiades point.
    riblah_1001 holds the 11 Orontes verses (2 Kgs 23:33, 25:6, 25:20-21;
    Jer 39:5-6, 52:9-10, 52:26-27; Ezek 6:14), displays 34.431703,
    36.545259 (OpenBible ab2bde8), and has the same Pleiades URI but no
    stored Pleiades coordinates.
  proposed: >-
    Research only. Decide whether Num 34:11 names a different Riblah
    (the "Riblah of Shepham" on Israel's northern border) from Riblah
    on the Orontes, where Pharaoh and Nebuchadnezzar sat in judgment.
    If they are distinct, move riblah_1002 off the Orontes Pleiades
    point — either to a Shepham-area site or to no point. If they are
    the same place, keep the Pleiades point and let GeoJSON follow it
    under DQ-0072. No Airtable or GeoJSON change until Robert decides.
  evidence: >-
    Num 34:11 lists Riblah in the northern-border itinerary with Shepham
    and the sea of Chinnereth (Galilee). 2 Kgs 23:33, 25:6 and Jer 39:5,
    52:9 place Riblah in the land of Hamath, on the Orontes, as the
    Egyptian and Babylonian headquarters. Pleiades 431124909
    (34.432149, 36.549142) is that Orontes site. OpenBible ac95bd8
    (used on riblah_1002) is 34.353071, 36.385705, about 19 km from
    Pleiades, not at the GeoJSON Shepham pin. The GeoJSON feature for
    riblah_1002 is titled "Riblah (of Shepham)" at 33.536944, 36.366111,
    101 km from the Pleiades point. Some identifications put the
    border Riblah farther south, closer to the springs east of the
    Beqaa or to a site near the Sea of Galilee; others treat the two
    names as the same Hamath Riblah.
  checks: []
  rule: null
  found: { date: 2026-11-24, by: "DQ-0031 Group A review (Robert)", sha: null }
  fixed: { date: null, sha: null }
  github: null
  affects: [theographic-web, geo]
