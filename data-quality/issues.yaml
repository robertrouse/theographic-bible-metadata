  field: canonicalPlace, openBibleUri, latitude, longitude, verses (places), mdText, richText
  current: >-
    canonicalPlace sends each of these to a different place with the same or
    a similar name, so it displays there. Distances are between the two
    OpenBible points. beer_165 (Judg 9:21) → beer_164 in Moab (Num 21:16),
