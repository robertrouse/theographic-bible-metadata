    Theographic person tagged in that verse whose name was compatible. That
    gave 2,968 mutual pairs, covering 97.4% of TIPNR persons and 97.9% of
    Theographic people. Rules then sorted the mismatches into patterns, and
    each example was checked by hand. The gender pattern has 25 mismatched
    pairs, listed in the cross-check's gender table with hand-checked
    verdicts. Of the other five: TIPNR is wrong on Lapidoth (Judg 4:4 "the
