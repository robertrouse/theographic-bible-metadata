# Theographic data-quality ledger
#
# One entry per issue. This file is the system of record for known data problems,
# whatever their origin: found by hand, by a consumer build (e.g. the timeline poster),
# by an automated rule, or reported through the GitHub "Data correction" issue form.
# Fixes happen in Airtable; the next export plus `checks` below confirm them.
#
# Fields
#   id          DQ-#### (never reused)
#   title       one line
#   status      open | needs-research | fixed | wontfix
#   type        wrong-value | off-by-one | bad-link | typo | missing-record |
#               missing-link (record exists, its verse links do not) |
#               duplicate-record | schema (a field's shape, not its value)
#   severity    high (wrong on a published chart) | medium | low (cosmetic)
#   table       events | people | places | verses | books | ...
#   records     [{ id: Airtable rec ID, key: human-readable key }]
#   field       field name as exported to json/
#   current     value at `found.sha`
#   proposed    the correct value, if known
#   evidence    Scripture, a source from docs/data-source-bibliography.md, or the data's own rules
#   checks      machine-checkable assertions that are true once fixed
#               ops: equals | not_equals | contains | not_contains | matches | not_matches
#   rule        name of the automated rule that detects this class of problem (optional)
#   found       { date, by, sha }   sha = theographic commit the issue was observed at
#   fixed       { date, sha }       filled when checks pass on an export
#   github      issue number, if one exists
#   affects     downstream consumers that showed the problem
#   notes       free text
#
# Standing rules
#   - Any verse tagging change must update BOTH the structured arrays (verses.people /
#     places / peopleGroups and their reverse links) AND the inline markdown links in
#     mdText and richText.
#   - Person tags stay whenever the verse names the person, even in a later context.
#     Collective phrases ("children of Israel") get the group ADDED alongside the person.
#   - Geo changes must sync between Airtable places and the geo/ GeoJSON (Linked Places).
#     Rerun the geo consistency check after every geo build or Airtable place edit.
#   - Geo review: when a place confidently matches a Pleiades record, Pleiades is
#     authoritative for location. Geo issues follow the same review process as all others.

- id: DQ-0001
  title: Lifetime of Jacob uses Isaac's age (180 years) instead of 147
  status: fixed
  type: wrong-value
  severity: high
  table: events
  records:
    - { id: recTkocSMI0NxpIrw, key: "Lifetime of Jacob (eventID 86)" }
  field: duration
  current: "180Y"
  proposed: "147Y"
  evidence: >-
    Gen 47:28 (Jacob lived 147 years). Death of Jacob (recwCFb0NhrYMkl8t) is already
    Birth of Jacob and Esau + 147Y = -1688, so the lifetime bar ends 33 years after his death.
  checks:
    - { record: recTkocSMI0NxpIrw, field: duration, equals: "147Y" }
  rule: lifetime-matches-birth-death
  found: { date: 2026-11-04, by: "timeline poster v0.2 (normalize.mjs)", sha: 3f461f2 }
  fixed: { date: 2026-11-09, sha: 2aa6cd3 }
  github: null
  affects: [timeline-poster]

