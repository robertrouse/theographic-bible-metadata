- id: DQ-0037
  title: Reign of Uzziah links to Jeroboam I instead of Jeroboam II
  status: fixed
  type: bad-link
  severity: medium
  table: events
  records:
    - { id: recOJfWD0IUcT4yJD, key: "Reign of Uzziah (eventID 204)" }
  field: predecessor, lag
  current: "[rec824qPcsyF7GtTh Reign of Jeroboam I (-974)], lag 27Y SS; start -809, so predecessor start + lag = -947 (138 years off)"
  proposed: "[recGe7VTJOGbn63NQ Reign of Jeroboam II (-824)], lag 15Y SS (-824 + 15 = -809)"
  evidence: >-
    2 Ki 15:1 "In the twenty-seventh year of Jeroboam's reign over Israel, Azariah son of Amaziah
    became king of Judah" refers to Jeroboam II (son of Jehoash). Jones, Appendix F: Jeroboam II
    pro-rex 837 BC, sole rex 825 BC (stored -824); Uzziah 810 BC (stored -809). The 27th year
    counts from the 837 BC pro-rex start; from the stored sole-reign start it is 15 elapsed years.
  checks:
    - { record: recOJfWD0IUcT4yJD, field: predecessor, contains: recGe7VTJOGbn63NQ }
    - { record: recOJfWD0IUcT4yJD, field: predecessor, not_contains: rec824qPcsyF7GtTh }
    - { record: recOJfWD0IUcT4yJD, field: lag, equals: "15Y" }
  rule: lag-matches-start
  found: { date: 2026-11-09, by: "lag audit (predecessor start + lag vs startDate, live Airtable)", sha: 8e73bfc }
  fixed: { date: 2026-11-13, sha: null }
  github: null
  affects: []
  notes: >-
    Lag convention (Robert, Nov 9 2026): lags work like project scheduling, so SS lag = successor
    start - predecessor start in elapsed years. The biblical "Nth year" wording goes in notes, not the lag.
    Fixed 2026-11-13 in Airtable: predecessor changed from Reign of Jeroboam I (rec824qPcsyF7GtTh)
    to Reign of Jeroboam II (recGe7VTJOGbn63NQ), and lag from 27Y to 15Y. lagType SS and startDate -809
    unchanged; -824 + 15 = -809. Only those two fields changed. fixed.sha to be filled from the next export.

