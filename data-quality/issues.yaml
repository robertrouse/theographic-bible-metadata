    change. Then review each pair. Zibeon depends on the Anah question
    (Gen 36:2 "Anah the daughter of Zibeon" vs 36:24 "Anah… son of
    Zibeon"), so it needs research.
  evidence: >-
    Easton "Harbona: …one of the seven eunuchs… (Esther 1:10; 7:9)". Easton
    "Jerubbesheth: …a surname also of Gideon (2 Sam. 11:21)". Easton
    "Rachab: =Rahab, a name found in the genealogy of our Lord (Matt. 1:5)".
    ISBE "Ehi: Apparently a contracted form (Genesis 46:21). See AHIRAM."
    2 Chr 2:13-14 and 4:11, 4:16 describe the same craftsman as 1 Kgs 7:13-14.
  checks: []
