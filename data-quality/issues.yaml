- id: DQ-0097
  title: "No Lair/Lahiru place for 2 Kgs 19:13 and Isa 37:13, where the KJV reads \"the city of Sepharvaim\""
  status: needs-research
  type: missing-record
  severity: low
  table: places
  records:
    - { id: recvyjBlyKvcsXhY1, key: "sepharvaim_1050" }
    - { id: recpeMhD0rbxCC3Wn, key: "2Kgs.19.13" }
    - { id: recqnMVbecbNGOpfn, key: "Isa.37.13" }
  field: null
  current: >-
    There is no Theographic place record for Lair, Lahir, or Lahiru.
    2 Kgs 19:13 and Isa 37:13 are tagged to hamath_516, arpad_96,
    sepharvaim_1050, hena_560, and ivvah_605, and the markdown follows
    the KJV: "the king of the city of Sepharvaim." OpenBible ancient.jsonl
    and official ACAI have no Lair/Lahir article. Published TIPNR has no
    Lair token in the copy on disk.
  proposed: >-
    Decide whether to add a Lair/Lahiru place for 2 Kgs 19:13 and Isa 37:13
    (Assyrian Lahiru in northeastern Babylonia, often identified with Eski
    Kifri in the Diyala valley) or to document a decision to follow the
    KJV common-noun reading and leave the verses on Sepharvaim. A new
    record needs people, places, and verses, and review, before any write.
    Coordinates would need independent research; they are not in OpenBible.
  evidence: >-
    STEPBible-Data issue #81 comment by David Instone-Brewer (21 Nov 2026),
    https://github.com/STEPBible/STEPBible-Data/issues/81#issuecomment-7061391663,
    which cites "Lair" as a place older Bibles translated as a common word
    and as a Mesopotamian capital. In 2 Kgs 19:13 and Isa 37:13 the Hebrew
    לָעִיר (laʿir) is "of the city" in the KJV and ESV, but Revised English
    Bible ("Lahir"), New Jerusalem Bible, NJPS Tanakh, and Bible en français
    courant take it as the proper name Lair/Lahir, the Assyrian city Lahiru.
    UBS handbooks on 2 Kings and Isaiah record both options.
  checks: []
  rule: null
  found: { date: 2026-11-21, by: "STEPBible-Data issue #81 comment (David Instone-Brewer), verified", sha: a8a7a94 }
  fixed: { date: null, sha: null }
  github: null
  affects: [theographic-web]
  notes: >-
    David said "a few places" are hidden this way; Lair is the only one he
    named. Further examples, if any, would be in the unpublished TIPNR he
    offered to share. New records stay in review until approved.

