    ancient.jsonl (a81ab85, ae44746), published TIPNR (Sheba@1Ki.10.1-Luk,
    Seba@Psa.72.10-Isa), and Ps 72:10, which names Sheba and Seba in one
    verse. Isa 43:3 is already correctly on seba_1037 in Theographic and
    TIPNR; OpenBible still puts it on Sheba.
  checks: []
  rule: null
  found: { date: 2026-11-21, by: "STEPBible-Data issue #81 comment (David Instone-Brewer), verified", sha: a8a7a94 }
  fixed: { date: null, sha: null }
  github: null
  affects: [theographic-web]
  notes: >-
    Theographic already keeps two records, so this is not a simple OpenBible
    merge. The Ethiopia pin 9.022736, 38.746799 is shared by Theographic
    Airtable, the published TIPNR map link, and ACAI's vizbible and obi
    fields (ACAI alternate_sources.vizbible points at recPLjuDonDk53ED5
    and recaljrl2Vew430Ta). That agreement is not independent confirmation.
    TIPNR's prose says Yemen, which agrees with current OpenBible, Christian
