- id: DQ-0095
  title: "sheba_1067 and seba_1037 share OpenBible a81ab85 and the Ethiopia pin; Josh 19:2 is tagged to the kingdom"
  status: open
  type: bad-link
  severity: medium
  table: places
  records:
