  field: openBibleLat, openBibleLong, latitude, longitude
  current: >-
    157 place records with no canonicalPlace and no Pleiades link sit on 76
    points shared with unrelated places. Each is more than 25 km from its
    own OpenBible point. Largest clusters: 32.049953, 35.733402 in Gilead
    (8 Simeon/Negev towns: baalath-beer_138, bethel_203, bethuel_240,
    bethul_241, chesil_289, eltolad_380, ezem_422, iim_593; aliases such as
    tolad, bealoth and ramoth_982 follow them). 30.317396, 35.407152
    (12 wilderness stations of Num 33: bene-jaakan, haradah, hashmonah,
    kehelathah, makheloth, mithkah, moseroth, mount_hor, mount_shapher,
    rissah, tahath, terah). 31.8099, 34.9365 (7 Judah/Simeon towns).
    31.49685, 35.78284 (6 Moab stations). 30.73469, 35.60625 (5 Edom
    places). 27.08847, 34.77173 (5 Red Sea names). sharon_1064 (1 Chr 5:16,
    Sharon in Gilead/Bashan) sits on Mount Hermon. For 150 of the 157,
    geo/bible-places.geojson already has the record's own OpenBible point
    (within 1 km), so the Airtable openBibleLat/Long is the stale side.
  proposed: >-
    For each record, set openBibleLat/Long, and therefore the displayed
    latitude/longitude, to the record's own OpenBible point. That matches
    the GeoJSON for 150 of the 157. Review the other 7 by hand. Don't
    "sync" these from Airtable to the GeoJSON (see DQ-0072).
  evidence: >-
    OpenBible ancient.jsonl (copy dated Nov 17 2026): identifications[0]
    resolutions lonlat per article. Josh 15:21-32 and 19:1-8 place Eltolad,
    Iim, Ezem, Bethul and Baalath-beer in the Negev of Judah/Simeon, not
    Gilead. Num 33:24-34 lists the stations in the wilderness. Easton
    "Sharon" (2): "a district east of the Jordan… in Gilead" (1 Chr 5:16).
