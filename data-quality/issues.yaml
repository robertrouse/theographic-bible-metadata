  status: open
  type: bad-link
  severity: low
  table: events
  records:
    - { id: recnTimjDqmxMYqRZ, key: "Death of Isaac (eventID 110)" }
  field: predecessor
  current: "[recnTimjDqmxMYqRZ] (itself), lag 180Y FS"
  proposed: "Birth of Isaac, lag 180Y FS"
  evidence: Gen 35:28. A self-link creates a cycle for any topological ordering of events.
  checks:
    - { record: recnTimjDqmxMYqRZ, field: predecessor, not_contains: recnTimjDqmxMYqRZ }
  rule: predecessor-acyclic
  found: { date: 2026-11-04, by: "timeline poster v0.2 (normalize.mjs)", sha: 3f461f2 }
