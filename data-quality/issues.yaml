  proposed: >-
    Duration = elapsed years from start to Jones's end (the next event's start), as in scheduling software: start + duration = Jones end. This is the same rule as the lag fix in DQ-0048, applied to duration.
  evidence: >-
    Jones, Appendix F pp.278-280 successor rows (listed per span). The text's regnal years (e.g. Jeroboam 22 years, 1 Ki 14:20) count the accession year inclusively in Israel's non-accession reckoning (Jones p.130), so start + regnal years lands a year late; Asa, Jehu, Zachariah and Menahem land a year early.
