    - { id: recCRPTx3QEUbEDnD, key: "Josh.19.2" }
  field: openBibleUri, latitude, longitude, verses
  current: >-
    sheba_1067 and seba_1037 are separate records, but both wear OpenBible
    a81ab85 and both display at 9.022736, 38.746799 (Addis Ababa). Neither
    has a Pleiades link. OpenBible has no Seba article: a81ab85 "Sheba 1"
    folds Sheba, Seba, and Sabeans together (18 verses, including Isa 43:3).
    Current OpenBible/Christian Pure coordinates for a81ab85 are 15.34833,
    44.20639 (Sana'a / Yemen). Theographic GeoJSON already places both
    "Sheba (Arabia)" and "Seba" at 15.348333, 44.206389, so Airtable and
    GeoJSON disagree by about 920 km (also in the DQ-0031 / DQ-0072 class).
    sheba_1067's 17 verses include Josh 19:2 (the Simeonite town, tagged
    together with beersheba_170 and moladah_816) and omit Joel 3:8 and
    Luke 11:31. seba_1037 correctly has Ps 72:10 and Isa 43:3, matching
    published TIPNR. OpenBible ae44746 "Sheba 2" is Josh 19:2 only, pinned
    at Beersheba.
  proposed: >-
    Give Seba its own identity in the OpenBible URI (or leave the URI
    empty if OpenBible never splits it) and decide the display coordinates
    independently: current OpenBible/CP and GeoJSON use Yemen (15.34833,
    44.20639); Airtable and the published TIPNR map pin use Ethiopia
    (9.022736, 38.746799), though TIPNR's own article text locates Sheba
    in Yemen. Stop pointing Josh 19:2 at the kingdom: either retag it to
    beersheba_170 only, or add a town record for OpenBible ae44746.
    Related verse tags are in DQ-0096.
  evidence: >-
    STEPBible-Data issue #81 comment by David Instone-Brewer (21 Nov 2026),
    https://github.com/STEPBible/STEPBible-Data/issues/81#issuecomment-7061391663,
